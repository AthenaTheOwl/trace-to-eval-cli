# Maps each schema to the files it governs, for
# scripts/validate_data_conformance.py. validate_schemas.py checks the
# schema files themselves; this file is what makes them constrain the
# data they describe.
version: 1
mappings:
  - schema: eval-case.schema.json
    files: ["examples/eval-cases/*.json"]
    records: self
  - schema: run-report.schema.json
    files: ["reports/*.json"]
    records: self
  - schema: trace.schema.json
    files: ["examples/traces/canonical/*.json"]
    records: self
